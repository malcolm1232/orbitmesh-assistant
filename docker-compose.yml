# Local stack: Qdrant + the assistant.
#
#   docker compose up -d --build --wait          # qdrant + HTTP wrapper on :8080 (indexes on start-up)
#   docker compose run --rm ingest               # re-index after editing corpus/ (then restart app)
#   docker compose run --rm chat                 # interactive CLI in the terminal
#   echo '{"session_id":"a","message":"hi"}' | docker compose run --rm -T chat chat --jsonl
#
# The assistant reads OPENROUTER_API_KEY from .env (copy .env.example). Without a key,
# set LLM_PROVIDER=mock in .env to run the no-credentials mode.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app: &app
    build: .
    image: orbitmesh-assistant:local
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - app_data:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    # No dependency on the one-shot `ingest` service: the app syncs the index on start-up whenever it
    # does not match the connectors (a fresh Qdrant volume included), and its healthcheck only passes
    # after that. A completed one-shot service in the default set makes `up --wait` hang or fail.
    depends_on:
      qdrant:
        condition: service_healthy

  ingest:
    <<: *app
    restart: "no"
    ports: []
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["ingest"]
    profiles: ["tools"]        # `docker compose run --rm ingest` - not part of `up`

  chat:
    <<: *app
    restart: "no"
    ports: []
    stdin_open: true
    tty: true
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["chat"]
    profiles: ["cli"]

volumes:
  qdrant_data:
  app_data:

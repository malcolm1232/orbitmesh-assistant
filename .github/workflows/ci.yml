# Runs when the corpus or the ingestion/retrieval code changes (and on every PR).
# No paid credentials anywhere in this workflow:
#   * `tests`  - unit + contract tests with the hashing embedder and the mock LLM (no network at all)
#   * `retrieval-eval` - ingests into an ephemeral Qdrant service with the real local
#     embedding model (free ONNX download), then runs the retrieval/guardrail eval subset
#     with the mock LLM and publishes the summary as a job artifact.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "src/orbitmesh/corpus.py"
      - "src/orbitmesh/embeddings.py"
      - "src/orbitmesh/vectorstore.py"
      - "src/orbitmesh/retrieval.py"
      - "scripts/**"
      - "eval/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_PROVIDER: hash
      QDRANT_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Unit, guardrail, memory and transport tests (offline)
        run: make test
      - name: Ingest + transport contract (offline)
        run: |
          make ingest
          make contract

  retrieval-eval:
    runs-on: ubuntu-latest
    needs: tests
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      EMBEDDING_PROVIDER: fastembed
      QDRANT_URL: http://localhost:6333
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/cache@v6
        with:
          path: .model-cache
          key: fastembed-bge-small-en-v1.5
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Ingest into the ephemeral Qdrant (twice - must be idempotent)
        run: |
          make ingest
          make ingest 2>&1 | tee ingest.log
          grep -q "stale deleted=0" ingest.log
      - name: Retrieval + guardrail eval (mock LLM, real local embeddings)
        run: make eval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval_results/

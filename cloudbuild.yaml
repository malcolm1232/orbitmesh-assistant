# Cloud Build pipeline: test -> build -> push -> deploy (see DEPLOYMENT.md).
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=asia-southeast1
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q -e ".[dev]" && \
        LLM_PROVIDER=mock EMBEDDING_PROVIDER=hash QDRANT_URL= python -m pytest -q
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/orbitmesh/assistant:$SHORT_SHA",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/orbitmesh/assistant:latest", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/orbitmesh/assistant"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "orbitmesh-assistant", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/orbitmesh/assistant:$SHORT_SHA", "--quiet"]
substitutions:
  _REGION: asia-southeast1
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/orbitmesh/assistant:$SHORT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
